[project]
name = "cscm-tool"
version = "4.16.1"
description = "Controller Status Code Management Tool"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# long SQL strings and section banners in tests are clearer unbroken
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"  # lets record_property measurements reach the test report
markers = ["performance: NFR-001 / TC-024 / TC-025 load tests (deselect with -m \"not performance\")"]

[tool.coverage.run]
source = ["app"]
