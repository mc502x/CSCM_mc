{% extends "base.html" %}
{% block title %}Account Settings — CSCM Tool{% endblock %}
{% block content %}
<div class="page-header"><h1>Account Settings</h1></div>
<div class="card" style="max-width:420px">
  <h2>Change Password</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="12">
      <div class="hint">At least 12 characters.</div>
    </div>
    <button class="btn btn--primary" type="submit">Change Password</button>
  </form>
</div>
{% endblock %}
