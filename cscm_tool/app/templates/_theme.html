<label class="visually-hidden" for="theme_select_{{ where }}">{{ _('Theme') }}</label>
<select id="theme_select_{{ where }}" class="theme-select" data-theme-select title="{{ _('Theme') }}">
  <option value="auto">{{ _('Automatic (system)') }}</option>
  <option value="light">{{ _('Light') }}</option>
  <option value="dark">{{ _('Dark') }}</option>
</select>
