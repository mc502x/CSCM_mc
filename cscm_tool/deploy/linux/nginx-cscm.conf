# CSCM Tool behind nginx on the internal network (docs/14-deployment-architecture.md section 3).
# TLS certificates come from the organisation's internal CA. The application listens on
# 127.0.0.1:8000 only; CSCM_TRUSTED_PROXY=127.0.0.1 makes it believe the headers set below.
server {
    listen 443 ssl;
    server_name cscm.example.internal;

    ssl_certificate     /etc/ssl/cscm/cscm.crt;
    ssl_certificate_key /etc/ssl/cscm/cscm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # attachments are 10 MB, library imports up to 20 MB

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Monitoring scrapes /metrics from the internal monitoring host only (the application also
    # checks the client address and the optional METRICS_TOKEN).
    location = /metrics {
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }
}

server {
    listen 80;
    server_name cscm.example.internal;
    return 301 https://$host$request_uri;
}
