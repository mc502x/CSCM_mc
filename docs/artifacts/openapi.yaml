              name: { type: string }
              group: { type: string, nullable: true }
              subgroup: { type: string, nullable: true }
              prg_idx: { type: integer, nullable: true }
              state: { type: string, enum: [ready, changed, restorable, exists, blocked], description: "ready = new; changed = differs from the code in the catalogue (update the Draft or open a new revision); restorable = the code's change request was withdrawn (open a new Draft on the same number); exists = unchanged; blocked = problems" }
              action: { type: string, enum: [create, update, revise, restore], nullable: true }
              changes: { type: array, items: { type: string }, description: "Fields in which a changed program differs from the catalogue" }
              issues: { type: array, items: { type: object, properties: { column: { type: string }, message: { type: string } } } }
              warnings: { type: array, items: { type: string } }
              existing: { type: object, nullable: true }
        file_errors: { type: array, items: { type: object } }
        notes: { type: array, items: { type: string } }
        expires_hours: { type: integer }
